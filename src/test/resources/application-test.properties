
spring.application.name=motopecas-padrecicero-test

# Banco H2 em mem�ria
spring.datasource.url=jdbc:h2:mem:motopecas_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria as tabelas para os testes
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar SQL no terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate cria o schema no H2; não executar migrations MySQL nesta configuração
spring.flyway.enabled=false

api.security.token.secret=test-only-secret
